name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/terraform.yml', 'terraform/**']
  push:
    branches: [main]
    paths: ['.github/workflows/terraform.yml', 'terraform/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: terraform

env:
  AWS_REGION: eu-west-2
  TF_DIR: terraform
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_donation_admin_emails: ${{ secrets.DONATION_ADMIN_EMAILS || '[]' }}
  TF_VAR_donation_console_url: ${{ vars.DONATION_CONSOLE_URL }}
  TF_VAR_donation_domain_live: ${{ vars.DONATION_DOMAIN_LIVE || 'false' }}
  TF_VAR_donation_stripe_secret_key: ${{ secrets.DONATION_STRIPE_SECRET_KEY }}
  TF_VAR_donation_stripe_webhook_secret: ${{ secrets.DONATION_STRIPE_WEBHOOK_SECRET }}
  TF_VERSION: '1.14.8'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.INFRA_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        id: plan
        continue-on-error: true
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `#### Terraform plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.INFRA_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Outputs
        run: |
          terraform output -json > outputs.json
          { echo '## Terraform outputs'; echo '```json'; cat outputs.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.TF_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: ${{ env.TF_DIR }}/outputs.json
